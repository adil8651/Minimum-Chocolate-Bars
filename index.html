<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Input and Display</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Minimum Chocolate Bars</h2>
        <label for="boxSize">What is the Box Size?</label>
        <input type="number" id="boxSize" placeholder="Enter Box Size">

        <label for="chocolateSizes">Enter The Chocolate Sizes (comma-separated):</label>
        <input type="text" id="chocolateSizes" placeholder="e.g., 1,2,3">

        <button onclick="findLeastChocolate()">Find Minimum Chocolate Bars</button>

        <div class="output">
            <label for="lestChocolate">Lest Chocolate Bars</label>
            <input type="text" id="lestChocolate" readonly>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
